[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "deptry",
  "lxml-stubs>=0.5.1",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.1",
  "mkdocs-typer2>=0.1.6",
  "ty>=0.0.3"
]

[project]
authors = [{name = "ninanor", email = "niccolo.cantu@nina.no"}]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "django-environ",
  "dlt[duckdb,filesystem,parquet,s3]>=1.17.1",
  "numpy>=2.2.6",
  "structlog>=25.5.0",
  "rich>=14.2.0",
  "typer>=0.20.0",
  "pygeometa @ git+https://github.com/nicokant/pygeometa@gbif-eml#egg=pygeometa",
  "orjson>=3.11.4",
  "duckdb>=1.4.3",
  "lxml>=6.0.2",
  "openpyxl>=3.1.5",
  "python-calamine>=0.6.1",
  "requests>=2.32.5",
  "sling>=1.5.1",
  "beautifulsoup4>=4.13.3",
  "fsspec>=2025.3.2",
  "jinja2>=3.1.6",
  "s3fs>=2025.3.2",
  "shapely>=2.1.0",
  "xmltodict>=0.14.2",
  "pyarrow>=20.0.0",
  "httpx>=0.28.1",
  "setuptools>=65.5.0",
  "backoff>=2.1.0",
  "pyyaml>=6.0.3",
]
description = ""
license = "GPL-3.0+"
name = "datasync"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.scripts]
datasync = "datasync.main:app"
dms_sync = "datasync.dms:app"
nva_sync = "datasync.nva:app"
ubw_sync = "datasync.ubw:app"

[tool.deptry.per_rule_ignores]
DEP002 = ["rich", "numpy", "setuptools"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]
